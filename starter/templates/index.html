<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <span id="game-timer" aria-label="Elapsed time">00:00</span>
    <span id="hint-count" aria-live="polite">Hints used: 0</span>
    <span id="message" role="status" aria-live="polite" aria-atomic="true"></span>
    <section id="completion-summary" class="completion-summary" hidden aria-label="Completion summary">
      <h2>Congratulations!</h2>
      <p>Your Sudoku is complete.</p>
      <dl>
        <dt>Completion time</dt>
        <dd id="completion-time">00:00</dd>
        <dt>Difficulty</dt>
        <dd id="completion-difficulty"></dd>
        <dt>Hints used</dt>
        <dd id="completion-hints">0</dd>
      </dl>
    </section>
  </div>
  <section id="leaderboard" class="leaderboard" aria-label="Top 10 leaderboard">
    <h2>Top 10 Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Player Name</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js?v=leaderboard"></script>
</body>
</html>
